[workspace]
resolver = "2"
members = ["crates/wincraft-core", "crates/wincraft-server", "apps/desktop/src-tauri"]
default-members = ["crates/wincraft-core", "crates/wincraft-server"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
